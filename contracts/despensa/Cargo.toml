[package]
name = "despensa"
version = "0.1.0"
edition = "2021"
publish = false
description = "Pre-sale escrow for local products: vouchers, milestone advances, seller bonds, guarantee pool and on-chain reputation."

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
