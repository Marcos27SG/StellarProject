    .l { stroke: #1e6b47 } .r { stroke: #a87406 }
    @media (prefers-color-scheme: dark) { .l { stroke: #5fbf8a } .r { stroke: #e0a93b } }
  </style>
  <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
    <rect width="32" height="32" fill="#fff"/>
    <path d="M13.6 8.6 L18.4 13.4" stroke="#000" stroke-width="6.4"/>
  </mask>
  <path class="l" d="M12 7 L21 16 L12 25 L3 16 Z" stroke-width="3.2"/>
  <path class="r" d="M20 7 L29 16 L20 25 L11 16 Z" stroke-width="3.2" mask="url(#cut)"/>
